<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0f2744">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Update - Quarterly Newsletter</title>
<style>
:root{--bg:#eaf0f6;--card:#fff;--ink:#14243a;--mut:#5b6b80;--navy:#0f2744;--blue:#0360aa;--tint:#eef3fa;--line:#d5dfeb;--hi:#dfeaff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1522;--card:#14223a;--ink:#e6edf7;--mut:#9fb0c6;--navy:#08111f;--blue:#6aa5ff;--tint:#1a2b47;--line:#27395a;--hi:#1f3a66}}
:root[data-theme="dark"]{--bg:#0c1522;--card:#14223a;--ink:#e6edf7;--mut:#9fb0c6;--navy:#08111f;--blue:#6aa5ff;--tint:#1a2b47;--line:#27395a;--hi:#1f3a66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:720px;margin:0 auto;padding:0 12px 32px}
.head{background:var(--navy);color:#fff;padding:22px 18px;border-radius:0 0 10px 10px}
.head h1{font:700 34px/1.1 Georgia,"Times New Roman",serif;margin:6px 0}
.head p{margin:0;color:#c3d2e6;font-size:14px}
.head small{color:#8fb0da;font-size:13px}
.box{background:var(--card);border-radius:10px;padding:16px;margin-top:12px}
.box h2{font:700 18px Georgia,serif;margin:0 0 8px}
.jump{margin:0;padding-left:20px}.jump li{padding:3px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stat{background:var(--navy);color:#fff;border-radius:8px;padding:10px 8px}
.stat b{display:block;font:700 18px Georgia,serif}.stat span{font-size:11px;color:#b6c8df}
.art{position:relative;overflow:hidden;height:150px;border-radius:8px 8px 0 0;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:600;font-size:13px;background:linear-gradient(135deg,hsl(var(--h) 60% 32%),hsl(calc(var(--h) + 40) 65% 52%))}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.art span{position:relative;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:4px}a:focus-visible,.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}.card{transition:box-shadow .15s}.card:hover{box-shadow:0 4px 16px rgba(15,39,68,.18)}
@media(min-width:900px){.head{padding:30px 28px}.head h1{font-size:44px}.top{display:grid;grid-template-columns:1.2fr 1fr}.top .art{height:100%;min-height:260px;border-radius:10px 0 0 10px}.stat b{font-size:24px}.stat span{font-size:13px}}
.top .art{height:210px;border-radius:10px 10px 0 0}
.card{background:var(--card);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.card .in{padding:12px 14px 14px}
.card h3{font:700 19px/1.25 Georgia,serif;margin:6px 0}
.cat{color:var(--blue);font-size:13px;font-weight:600}
.tldr{background:var(--tint);border-radius:6px;padding:8px 10px;font-size:14px;margin:8px 0}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.top{margin-top:12px}
.cta{background:var(--blue);color:#fff;border-radius:10px;padding:16px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cta a{background:#fff;color:#1a5fc4;border-radius:6px;padding:8px 12px;font-weight:600;white-space:nowrap}
.logo{background:#fff;border-radius:8px;padding:8px 12px;display:inline-block;margin-bottom:10px}.logo img{height:54px;display:block}.about p{margin:6px 0;font-size:15px}.foot b{color:var(--ink)}
.foot{font-size:12px;color:var(--mut);margin-top:16px}
.btn{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:7px 12px;color:var(--ink);font-size:14px;background:var(--card)}
.story h1{font:700 30px/1.2 Georgia,serif;margin:6px 0 10px}
.story p{font-family:Georgia,serif;font-size:17px;line-height:1.7}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.bar{height:5px;background:var(--line);border-radius:3px;flex:1;margin:0 10px}.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.ed{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.toc a{display:flex;justify-content:space-between;gap:8px;padding:8px 8px;border-bottom:1px solid var(--line);color:var(--ink);font-size:15px;border-radius:4px}
.toc a.on{background:var(--hi);color:var(--blue);font-weight:600}
.bottom{display:flex;align-items:center;margin-top:12px;font-size:14px;color:var(--mut)}
@media(min-width:700px){.wrap{max-width:980px}.ed{grid-template-columns:300px 1fr}}
@media(max-width:560px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>

 {id:"award", cat:"Top story: Award", title:"Our engineering team wins the Centre of Excellence award", mins:1, h:215,
  tldr:"Industry jury recognises the team for durability testing and quality work across vehicle programmes.",
  body:["The Centre of Excellence award was presented at the annual industry summit, where a jury reviewed entries from more than forty organisations.","The team was recognised for three things: consistent test quality, fast turnaround for customers, and a strong record of knowledge sharing with suppliers.","The award belongs to everyone who worked on the programmes this year. Next quarter the team will open its facilities for customer visits and demo days."]},
 {id:"tyre", cat:"New capability", title:"Functional testing of safety devices at the new site", mins:2, h:20,
  tldr:"A new test method and checklist were built, shared with the regulator and demonstrated to industry.",
  body:["No standard test facility existed for this class of devices, so the team created its own method and checklist.","The method was submitted to the regulator and demonstrated live. Qualification tests are now open to the wider industry.","Customers can book slots from next month. Ask us for the test scope and indicative pricing."]},
 {id:"cyber", cat:"Explainer: Cybersecurity", title:"Securing the connected, software-defined vehicle", mins:3, h:150,
  tldr:"New standards make threat analysis mandatory. Seven steps rate each threat on impact and feasibility.",
  body:["As vehicles become software platforms, threat analysis is now a regulatory requirement in many markets.","The process has seven steps: define the item, identify assets, find threats, rate impact, rate feasibility, decide treatment, and document the result.","Teams that start early save rework later. We run short workshops that walk your team through a first analysis on your own product."]},
 {id:"sim", cat:"Case study: Efficiency", title:"Simulation picks the right aggregates to cut energy use", mins:2, h:270,
  tldr:"An energy audit on a truck, modelled in simulation, showed low-resistance tyres gave about 9% more power at the wheels.",
  body:["An OEM asked which changes would reduce energy consumption most. The team built a simulation model and validated it against track data.","Low rolling-resistance tyres gave the largest gain. Changing the axle ratio barely moved the result.","The same approach can be reused for buses and light commercial vehicles."]},
 {id:"bench", cat:"New facility: EV powertrain", title:"Two-motor test bench speeds up e-axle development", mins:1, h:190,
  tldr:"400 kW, 4,000 rpm and hardware-in-the-loop, open round the clock to OEMs and suppliers.",
  body:["The bench evaluates performance, efficiency, durability and noise for passenger cars, SUVs and light commercial vehicles.","Supporting systems include coolant conditioning, an electronic throttle actuator and a high-power DC supply. Hardware-in-the-loop lets teams test real hardware while road loads are simulated.","The bench runs 24x7 and is available for booking now."]},

  tldr:"Ten papers, from hydrogen fuel assist in engines to battery state-of-charge estimation.",
  body:["The new issue brings together ten peer-reviewed papers from researchers across industry and academia.","Highlights include hydrogen fuel assist in generator engines and a new method for estimating battery state of charge.","The full issue is free to read online."]}

 '<div class="grid">'+rest.map(card).join('')+'</div>'+
 '<div class="box about"><h2>About ARAI</h2><p>The Automotive Research Association of India (ARAI) was set up in 1966 by the automotive industry together with the Government of India, and is an autonomous body under the Ministry of Heavy Industries.</p><p>It is recognised as a Scientific and Industrial Research Organisation and is a notified testing and certification agency. Its sites include the Kothrud head office, a technology centre at Chakan and the Mobility Research Centre at Takwe, near Pune.</p></div>'+
